<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embla 1 in the browser</title>
<meta name="description" content="Embla 1, a 10B mixture-of-experts language model (4-bit), running entirely in the browser on WebGPU.">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
    --accent: #1f6f5b; --accent-ink: #ffffff; --user: #e8efe9; --think: #f0eee7; --warn: #a4372b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --panel: #1c1c1a; --ink: #ecebe5; --muted: #9a998f; --line: #2d2d2a;
      --accent: #4fb89c; --accent-ink: #0e1512; --user: #22302b; --think: #242421; --warn: #e58a7e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 12px;
           align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; }
  h1 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  h1 small a { color: var(--accent); }
  .stats { display: flex; gap: 8px 18px; flex-wrap: wrap; margin-left: auto; font-variant-numeric: tabular-nums; }
  .stat { display: flex; flex-direction: column; line-height: 1.2; }
  .stat b { font-size: 15px; } .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #loader { margin: 24px auto; width: min(560px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 16px; }
  #loader p { margin: 0 0 10px; } #loader .note { color: var(--muted); font-size: 13px; }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  #loader button { margin-top: 12px; margin-right: 8px; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .think { background: var(--think); border-radius: 8px; padding: 8px 12px; margin: 0 0 8px; color: var(--muted); font-size: 13.5px; }
  .think summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .think div { margin-top: 6px; white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; border-top: 1px dashed var(--line); padding-top: 6px; }
  .err { color: var(--warn); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px 14px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
             padding: 9px 11px; min-height: 42px; max-height: 160px; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opts { max-width: 760px; margin: 8px auto 0; display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
  .opts label { display: flex; align-items: center; gap: 6px; } .opts input[type=number] { width: 64px; }
  .opts input { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .opts .grow { flex: 1; } .empty { text-align: center; color: var(--muted); margin-top: 8vh; }
  [hidden] { display: none !important; }
  .fresh { animation: token-in .4s ease-out both; }                 /* newly decoded text */
  @keyframes token-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fresh { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>Embla 1 <small>4-bit · runs locally on WebGPU<span id="srcLink" hidden> · <a>source</a></span></small></h1>
  <div class="stats" aria-live="polite">
    <div class="stat"><b id="sPrefill">–</b><span>Prefill tok/s</span></div>
    <div class="stat"><b id="sDecode">–</b><span>Decode tok/s</span></div>
    <div class="stat"><b id="sCtx">0 / 4096</b><span>Context</span></div>
  </div>
</header>

<section id="loader">
  <p id="loadMsg">Embla 1 runs entirely in your browser. First start streams about 6.1 GB of weights to your GPU.</p>
  <progress id="loadBar" value="0" max="1" hidden></progress>
  <p class="note" id="loadNote">Needs a desktop browser with WebGPU and a few GB of free GPU memory.</p>
  <p class="note" id="cacheNote"></p>
  <button id="loadBtn" class="primary">Load model</button>
  <button id="clearBtn" type="button" hidden>Clear cached weights</button>
</section>

<main id="main" hidden><div class="wrap" id="log"><div class="empty">Ask something, in Danish or English.</div></div></main>

<footer id="foot" hidden>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message Embla…" aria-label="Message"></textarea>
    <button id="send" class="primary" type="submit">Send</button>
    <button id="stop" type="button" hidden>Stop</button>
  </form>
  <div class="opts">
    <label>Temperature <input id="temp" type="number" min="0" max="1.5" step="0.1" value="0.6"></label>
    <label>Max new tokens <input id="maxTok" type="number" min="16" max="3000" step="16" value="1200"></label>
    <span class="grow"></span>
    <button id="clearFoot" type="button" title="Delete the weights stored in this browser (the loaded model keeps working until you reload)">Clear cached weights</button>
    <button id="reset" type="button">New chat</button>
  </div>
</footer>

<script type="module">
import { AutoTokenizer, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6";
import { Embla, sample, MAX_CONTEXT } from "./src/engine.mjs";
import { WeightCache } from "./src/weight_cache.mjs";
import { modelSources } from "./src/config.mjs";

const $ = id => document.getElementById(id);
if (location.hostname.endsWith(".github.io")) {                  // on GitHub Pages: link the repository (<user>.github.io/<repo>/)
  $("srcLink").querySelector("a").href = `https://github.com/${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}`; $("srcLink").hidden = false;
}

let engine, tok, ids, busy = false, abort = null;
let pending = null, ended = true, first = true;            // see "turn bookkeeping" below
const gb = n => (n / 1e9).toFixed(2);
let status = "";
const fmt = (n, d = 1) => Number.isFinite(n) ? n.toFixed(d) : "–";

async function refreshCacheNote() {
  try {
    const names = (await caches.keys()).filter(n => n.startsWith("embla1-")); let n = 0;
    for (const name of names) n += (await (await caches.open(name)).keys()).length;
    const u = await WeightCache.usage();
    $("cacheNote").textContent = n > 0 ? `Weights are cached on this device (browser storage in use: ${gb(u.used)} GB${u.persisted ? ", persistent" : ""}). Loading will not download them again.`
      : `Nothing cached yet. The first load downloads about 6.1 GB and stores it in this browser${Number.isFinite(u.quota) ? ` (free quota about ${gb(u.quota - u.used)} GB)` : ""}.`;
    $("clearBtn").hidden = n === 0;
  } catch { $("cacheNote").textContent = ""; }
}
async function clearCache() {
  if (!confirm("Delete the cached model weights from this browser? The next load will download them again.")) return;
  await WeightCache.clearAll(); await refreshCacheNote(); if (engine) note("Cached weights deleted. The loaded model keeps working until you reload the page.");
}
$("clearBtn").onclick = clearCache; $("clearFoot").onclick = clearCache;
refreshCacheNote();

$("loadBtn").onclick = async () => {
  $("loadBtn").hidden = true; $("clearBtn").hidden = true; $("loadBar").hidden = false;
  try {
    const persist = WeightCache.requestPersistence();             // still inside the user gesture: ask the browser not to evict the 6 GB
    const src = await modelSources();
    if (src.tokenizer.localPath) { env.allowRemoteModels = false; env.allowLocalModels = true; env.localModelPath = src.tokenizer.localPath; }
    const tokJob = AutoTokenizer.from_pretrained(src.tokenizer.model, { revision: src.tokenizer.revision }); tokJob.catch(() => {});   // loads alongside the model
    engine = await Embla.load({
      weightsUrl: src.weightsUrl, graphUrl: src.graphUrl,
      onStatus: s => { status = s; $("loadMsg").textContent = s; },
      onProgress: p => {
        const done = p.cachedBytes + p.netBytes; $("loadBar").max = p.total; $("loadBar").value = done;
        const parts = [`${gb(done)} / ${gb(p.total)} GB`];
        if (p.cachedBytes) parts.push(`${gb(p.cachedBytes)} GB from cache`);
        if (p.netBytes) parts.push(`${gb(p.netBytes)} GB downloaded (${fmt(p.netBytes / 1e6 / Math.max(p.seconds, 0.1), 0)} MB/s)`);
        $("loadNote").textContent = parts.join(" · ");
      },
    });
    tok = await tokJob; await persist;
    const enc = s => tok.encode(s, { add_special_tokens: false });
    ids = { eos: enc("<|im_end|>")[0], enc };
    $("loader").hidden = true; $("main").hidden = false; $("foot").hidden = false; $("input").focus();
    const l = engine.loadStats;
    note(`Model ready in ${fmt(l.totalSeconds)} s · ` + (l.fromCache ? `weights loaded from the local cache (${gb(l.cachedBytes)} GB)`
      : l.cachedBytes ? `${gb(l.cachedBytes)} GB from cache, ${gb(l.netBytes)} GB downloaded`
      : `${gb(l.netBytes)} GB downloaded` + (l.cacheAvailable && !l.cacheWriteError ? " and cached for next time" : l.cacheWriteError ? ` (could not cache: ${l.cacheWriteError})` : " (browser cache unavailable)")));
  } catch (e) {
    $("loadMsg").innerHTML = ""; $("loadMsg").append(Object.assign(document.createElement("span"), { className: "err", textContent: "Could not load the model: " + (e.message || e) }));
    $("loadBar").hidden = true; $("loadBtn").hidden = false; $("loadBtn").textContent = "Retry"; refreshCacheNote();
  }
};

function note(t) { const d = document.createElement("div"); d.className = "empty"; d.textContent = t; $("log").append(d); }
function el(cls, text) { const d = document.createElement("div"); d.className = cls; if (text != null) d.textContent = text; return d; }
function scroll() { $("main").scrollTop = $("main").scrollHeight; }
function setCtx() { $("sCtx").textContent = `${engine.length} / ${MAX_CONTEXT}`; }

// Turn bookkeeping. The KV cache is kept between turns, so only new tokens are prefilled. The token sampled last is
// never fed during generation: if it was <|im_end|> it is fed at the start of the next turn; if generation was cut
// short (stop / max tokens) we feed it, then close the turn with <|im_end|>.
function turnTokens(userText) {
  const t = [];
  if (first) t.push(...ids.enc("<|endoftext|>"));
  else { if (pending != null) t.push(pending); if (!ended) t.push(ids.eos); }
  t.push(...ids.enc((first ? "" : "\n") + "<|im_start|>user\n" + userText + "<|im_end|>\n<|im_start|>assistant\n<think>\n"));
  return t;
}

function render(box, gen) {                                 // gen: generated token ids -> thinking block + answer
  let text = tok.decode(gen, { skip_special_tokens: false }).replace(/<\|im_end\|>/g, "");
  const cut = text.indexOf("</think>"), thinking = cut < 0 ? text : text.slice(0, cut), answer = cut < 0 ? "" : text.slice(cut + 8).replace(/^\s+/, "");
  box.think.firstElementChild.textContent = cut < 0 ? "Thinking…" : "Thought process";
  setText(box.think.lastElementChild, thinking.trim());
  if (cut >= 0 && !box.collapsed) { box.think.open = false; box.collapsed = true; }
  setText(box.answer, answer);
}

// Append only what is new since the last render, in a span that fades in. If earlier text changed (the tokenizer can re-merge
// bytes at the end), keep the unchanged prefix as plain text and fade in the rest. Many spans are collapsed into plain text:
// they finished fading long ago.
function setText(el, text) {
  const prev = el._text ?? "";
  if (text === prev) return;
  let keep = 0; while (keep < prev.length && keep < text.length && prev[keep] === text[keep]) keep++;
  if (keep < prev.length || el.childNodes.length > 150) el.textContent = text.slice(0, keep);
  const add = text.slice(el.textContent.length);
  if (add) el.append(Object.assign(document.createElement("span"), { className: "fresh", textContent: add }));
  el._text = text;
}

async function send(userText) {
  busy = true; abort = new AbortController();
  $("send").hidden = true; $("stop").hidden = false; $("input").disabled = true;
  $("log").querySelectorAll(".empty").forEach(n => n.remove());
  $("log").append(el("msg user", userText));
  const box = { think: document.createElement("details"), answer: el("answer"), collapsed: false };
  box.think.className = "think"; box.think.open = true;
  box.think.append(Object.assign(document.createElement("summary"), { textContent: "Thinking…" }), el("", ""));
  const bubble = el("msg"); const meta = el("meta", "Prefilling…");
  bubble.append(box.think, box.answer, meta); $("log").append(bubble); scroll();
  const gen = []; let preMs = 0, decStart = 0, steps = 0, reason = "";
  try {
    const prompt = turnTokens(userText);
    const maxNew = Math.max(1, +$("maxTok").value || 1200), temperature = +$("temp").value;
    const t0 = performance.now();
    let logits = await engine.feed(prompt, { signal: abort.signal });
    preMs = performance.now() - t0; first = false;
    $("sPrefill").textContent = fmt(prompt.length / (preMs / 1000));
    meta.textContent = `Prefill ${prompt.length} tok in ${fmt(preMs / 1000, 2)} s (${fmt(prompt.length / (preMs / 1000))} tok/s) · decoding…`;
    decStart = performance.now(); let next = sample(logits, { temperature });
    while (true) {
      gen.push(next); pending = next; ended = false;
      if (next === ids.eos) { ended = true; reason = "end of turn"; break; }
      if (gen.length >= maxNew) { reason = "max tokens"; break; }
      if (abort.signal.aborted) { reason = "stopped"; break; }
      const following = await engine.decodeSample(next, { temperature }, { signal: abort.signal }); steps++;   // GPU-sampled on the WGSL decoder
      const dt = (performance.now() - decStart) / 1000, rate = steps / dt;
      $("sDecode").textContent = fmt(rate); setCtx();
      const now = performance.now(); if (now - (box.last || 0) > 120) { box.last = now; render(box, gen); scroll(); }   // ~8 Hz: re-decoding the text every token costs decode speed
      meta.textContent = `Prefill ${prompt.length} tok in ${fmt(preMs / 1000, 2)} s (${fmt(prompt.length / (preMs / 1000))} tok/s) · decoding ${gen.length} tok · ${fmt(rate)} tok/s`;
      next = following;
    }
  } catch (e) {
    if (e.name !== "AbortError") { reason = "error"; bubble.append(Object.assign(el("err", String(e.message || e)))); }
    else reason = "stopped";
    if (!decStart) { engine.reset(); pending = null; ended = true; first = true; reason += " during prefill, conversation reset"; }   // half-filled cache is unusable
  } finally {
    render(box, gen);
    const dec = steps ? steps / ((performance.now() - decStart) / 1000) : NaN;
    meta.textContent = `Prefill ${fmt(preMs / 1000, 2)} s · decode ${gen.length} tok at ${fmt(dec)} tok/s (${fmt(steps ? (performance.now() - decStart) / 1000 : 0, 1)} s) · ${reason}`;
    if (steps) $("sDecode").textContent = fmt(dec);
    if (reason === "max tokens" && !box.collapsed) meta.textContent += " (still thinking: raise “Max new tokens” to get an answer)";
    setCtx(); busy = false; abort = null;
    $("send").hidden = false; $("stop").hidden = true; $("input").disabled = false; $("input").focus(); scroll();
  }
}

$("form").onsubmit = e => { e.preventDefault(); const v = $("input").value.trim(); if (!v || busy) return; $("input").value = ""; $("input").style.height = ""; send(v); };
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(160, e.target.scrollHeight) + "px"; });
$("stop").onclick = () => abort?.abort();
$("reset").onclick = () => { if (busy) abort?.abort(); engine.reset(); pending = null; ended = true; first = true;
  $("log").replaceChildren(el("empty", "New chat. Ask something.")); setCtx(); $("sPrefill").textContent = "–"; $("sDecode").textContent = "–"; };
</script>
</body>
</html>
